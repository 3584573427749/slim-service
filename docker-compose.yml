version: "3.9"

services:
  slim-service:
    container_name: slim-service
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  auth-service:
    container_name: auth-service
    image: ghcr.io/3584573427749/auth-service:latest
    restart: unless-stopped
